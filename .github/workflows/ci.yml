name: CI - Run All Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    # Pin the runner image so browser dependencies do not follow ubuntu-latest changes.
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      # Tests use an isolated MongoDB service, never the production Atlas cluster.
      MONGO_URI: mongodb://127.0.0.1:27017/skateguide_test
      MONGODB_URI: mongodb://127.0.0.1:27017/skateguide_test
      # Add other required environment variables from secrets
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-for-ci' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-nextauth-secret' }}
      NEXTAUTH_URL: http://localhost:3000

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    - name: Build production app
      run: npm run build

    - name: Run Unit Tests (Jest)
      run: npm run test

    - name: Run Linting
      run: npm run lint

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Run Playwright browser smoke tests
      run: npm run test:ui
      env:
        # Isolate browser-test records from Jest and all external databases.
        MONGO_URI: mongodb://127.0.0.1:27017/skateguide_playwright_test
        MONGODB_URI: mongodb://127.0.0.1:27017/skateguide_playwright_test

    - name: Upload Playwright failure artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-failure-artifacts
        path: |
          test-results/
          playwright-report/
        if-no-files-found: ignore
        retention-days: 7
